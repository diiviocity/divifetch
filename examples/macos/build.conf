;; the macos example: cross-compiled on linux, no sysroot needed — zig
;; ships the macOS libc headers and a libSystem.tbd stub, and the binary
;; loads /usr/lib/libSystem.B.dylib like every native one (macOS has no
;; static libc and no stable syscall ABI, so the modules answer through
;; libSystem: sysctlbyname, statfs, host_statistics64, getifaddrs,
;; libproc, and IOKit by dlopen — modules/zig/macos.zig).
;;
;; aarch64-macos is Apple silicon; swap in x86_64-macos.10.13 for Intel
;; Macs (and the OSX-KVM guest). the .N suffix is the oldest macOS the
;; binary launches on — zig 0.17 defaults to 15.0, which dyld refuses on
;; anything older: 11.0 is the first Apple silicon release, 10.13 the
;; first with kern.osproductversion. built natively on a Mac, drop the
;; -target.
(build
    :flags "-Doptimize=ReleaseFast -fstrip -target aarch64-macos.11.0 -lc"
    :target "divifetch-macos")
