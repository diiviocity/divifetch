;; the no-libc example: the whole fetch links static. -Dtarget=x86_64-linux-none
;; keeps the zig std on raw syscalls, and the rust side (hello_world_nostd)
;; pins its own panic handler, so the link takes no libc and no libunwind.
(build
    :flags "-Doptimize=ReleaseFast -fstrip -Dtarget=x86_64-linux-none"
    :target "divifetch")
