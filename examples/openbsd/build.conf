;; the openbsd example: cross-compiled on linux with the sysroot in ~
;; (see libc.txt). -target x86_64-openbsd keeps zig's std on the openbsd
;; ABI; the modules answer through openbsd's own rolls (sysctl(3),
;; statvfs(3), the apm device, getifaddrs(3)) declared in
;; modules/openbsd.zig against the sysroot headers.
(build
    :flags "-Doptimize=ReleaseFast -fstrip -target x86_64-openbsd -lc --libc libc.txt"
    :target "divifetch-openbsd")
