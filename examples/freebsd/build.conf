;; the freebsd example: cross-compiled on linux with the sysroot in ~
;; (see libc.txt). -target x86_64-freebsd keeps zig's std on the freebsd
;; ABI; the modules answer through freebsd's own rolls (sysctlbyname,
;; statvfs(3), kern.boottime, getifaddrs(3)) declared in
;; modules/freebsd.zig against the sysroot headers.
;;
;; one fixture patch outside this tree: the sysroot's usr/lib/libc.so
;; ldscript pins GROUP to the release's /lib/libc.so.7 — it now points
;; at the sysroot's own absolute (the original rides as libc.so.orig).
(build
    :flags "-Doptimize=ReleaseFast -fstrip -target x86_64-freebsd -lc --libc libc.txt"
    :target "divifetch-freebsd")
