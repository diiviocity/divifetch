(config
    (cc          "gcc")
    (cflags      "-std=c89 -O2")
    (target      "divifetch")
    (target-head "headgen")
    (default     "crun")
	(object-extension ".o")
	(archive yes))

(template c
	(source-file "module.c")
	(command "${cc} ${cflags} -c ${source_file} -o ${output_file}"))

(template cpp
	(source-file "module.cpp")
	(command "g++ -O2 -c ${source_file} -o ${output_file}")
	(linker-flags "-lstdc++"))
